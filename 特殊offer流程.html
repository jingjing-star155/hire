 if(!draft.comments.trim())return{id:'comments',message:'请填写Offer说明'};if(!draft.attachments.简历)return{message:'请上传简历'};if(draft.type==='social'&&!draft.attachments.薪资证明)return{message:'请上传薪资证明'};if(draft.fields.IS_WFL_HIR_HDR_IS_EDU_PASS==='N'&&!draft.attachments.学历特批邮件)return{message:'学历不符合要求时，请上传学历特批邮件'};
 if(draft.fields[F.bonus]&&draft.type!=='intern'){if(!draft.fields[F.entry])return{message:'请先填写计划到岗时间'};if(!(draft.bonusAmount>0))return{message:'请填写大于0的签约金总金额'};if(!draft.bonusTemplate)return{message:'请选择签约金模版'};if(Math.abs(draft.bonusSchedule.reduce((a,s)=>a+s.percent,0)-100)>.001||draft.bonusSchedule.some(s=>s.percent<=0||s.month<1))return{message:'各期发放比例必须大于0，合计为100%，且发放月份不得小于1'};}
 return null;}
function saveCandidate(submit){captureDraft();calculate();const error=validate(submit);if(error){editorTab='approval';updateEditorTab();$('form-error').textContent=error.message;$('form-error').hidden=false;const field=$('f-'+error.id)||(error.id==='comments'?$('offer-comments'):$('form-error'));field.scrollIntoView({block:'center'});field.focus();return;}
 const commit=()=>{const copy=clone(draft);copy.name=copy.fields[F.name];copy.entry=copy.fields[F.entry]||'';copy.department=copy.fields.PW_ORGTREE_LINE_DESCR254||copy.fields[F.dept]||'';copy.job=copy.fields[F.job]||copy.fields.IS_WFL_HIR_HDR_IS_POSITION_OUT||'';copy.status=submit?'已提交':'已保存';copy.submitted=submit?new Date().toLocaleDateString('sv-SE'):copy.submitted||'';copy.operator=submit?'示例审批人':'';history(copy,submit?'提交审批':'保存草稿',copy.comments);const before=clone(rows),i=rows.findIndex(r=>r.id===copy.id);if(i>=0)rows[i]=copy;else rows.unshift(copy);if(!persist()){rows=before;return false;}$('editor').close();setTab(submit?1:0);toast(submit?'已提交本地演示审批流程':'本地草稿已保存');return true;};
 if(submit)dialog('提交特殊offer流程',`<p>候选人：${esc(draft.name||draft.fields[F.name])}</p><p>提交后可在 On Going 查看此示例流程。</p><p class="notice">此操作仅保存在本机，不向原系统提交审批。</p>`,commit,'提交');else commit();}
$('save-button').onclick=()=>saveCandidate(false);$('candidate-form').onsubmit=e=>{e.preventDefault();saveCandidate(true);};
renderList();
})();
